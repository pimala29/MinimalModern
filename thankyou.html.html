<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ขอบคุณสำหรับคำสั่งซื้อ — ATELIER CACAO</title>

  <!-- Google Fonts: Serif Luxury + Clean Sans-Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Thai:wght@300;400;500&family=Noto+Serif+Thai:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
  <style>
    .site-header {
      border-bottom: 1px solid var(--border-subtle);
      background-color: var(--bg-page);
    }
    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      gap: 1.5rem;
    }
    .brand-wordmark {
      font-size: 1.25rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .thankyou-section {
      min-height: calc(100vh - 76px - 96px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block: clamp(4rem, 10vw, 7rem);
    }
    .thankyou-box {
      max-width: 580px;
      width: 100%;
      margin-inline: auto;
      text-align: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: clamp(2.5rem, 6vw, 4.25rem) clamp(1.5rem, 4vw, 3rem);
    }
    .thankyou-mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 1.5rem;
      border: 1px solid var(--accent-bronze);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-bronze);
      font-family: var(--font-serif);
      font-size: 1.25rem;
    }
    .thankyou-box .lead {
      margin-inline: auto;
      margin-bottom: var(--space-lg);
    }
    .site-footer {
      border-top: 1px solid var(--border-subtle);
      padding-block: 2.25rem;
    }
    .site-footer__inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <!-- Minimal Top Navigation -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand-wordmark font-serif">ATELIER CACAO</a>
    </div>
  </header>

  <main class="thankyou-section">
    <div class="container">
      <div class="thankyou-box">
        <div class="thankyou-mark" aria-hidden="true">&#10003;</div>
        <span class="eyebrow">Order Confirmed</span>
        <h1 class="section-title">ขอบคุณสำหรับคำสั่งซื้อ</h1>
        <p class="lead">
          เราได้รับข้อมูลคำสั่งซื้อของคุณเรียบร้อยแล้ว ทีมงานจะติดต่อกลับตามช่องทางที่คุณระบุไว้เพื่อยืนยันการจัดส่งโดยเร็วที่สุด
        </p>
        <a href="index.html" class="btn">กลับหน้าแรก</a>
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span class="brand-wordmark font-serif">ATELIER CACAO</span>
      <p class="text-muted">Minimal &amp; Modern Craft Chocolate</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
